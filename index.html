<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-select: none">
    <title>Аттестация сотрудников | Matrix Testing</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Matrix Rain Canvas */
        #matrix-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            background: #0a0f0a;
            display: block;
        }

        /* Main content overlay */
        .app-container {
            position: relative;
            z-index: 10;
            max-width: 880px;
            width: 100%;
            margin: 0 auto;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        /* Glassmorphism premium card */
        .card {
            background: rgba(10, 15, 10, 0.75);
            backdrop-filter: blur(12px);
            border-radius: 32px;
            box-shadow: 0 25px 45px -12px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(80, 255, 80, 0.15);
            transition: all 0.2s ease;
            overflow: hidden;
            border: 1px solid rgba(80, 255, 80, 0.25);
        }

        .card-inner {
            padding: 2.5rem;
        }

        /* start screen */
        .datetime-section {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        .date-display {
            font-size: 2rem;
            font-weight: 500;
            letter-spacing: -0.02em;
            color: #b8ffb8;
            text-shadow: 0 0 8px rgba(80, 255, 80, 0.5);
            margin-bottom: 0.5rem;
        }

        .time-display {
            font-size: 3.5rem;
            font-weight: 600;
            letter-spacing: -0.02em;
            color: #c0ffc0;
            font-feature-settings: 'tnum';
            font-variant-numeric: tabular-nums;
            margin-bottom: 0.5rem;
            text-shadow: 0 0 10px rgba(80, 255, 80, 0.6);
        }

        .calendar-mini {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background: rgba(20, 30, 20, 0.6);
            backdrop-filter: blur(4px);
            padding: 0.5rem 1.25rem;
            border-radius: 60px;
            font-size: 0.9rem;
            color: #8bc34a;
            border: 1px solid rgba(80, 255, 80, 0.3);
        }

        .calendar-mini svg {
            opacity: 0.8;
            stroke: #8bc34a;
        }

        .btn-start {
            background: linear-gradient(135deg, #1a3a1a, #0a2a0a);
            color: #c0ffc0;
            border: 1px solid rgba(80, 255, 80, 0.5);
            width: 100%;
            padding: 1rem;
            font-size: 1.1rem;
            font-weight: 500;
            border-radius: 60px;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 1rem;
            font-family: inherit;
            box-shadow: 0 0 15px rgba(80, 255, 80, 0.2);
        }

        .btn-start:hover {
            background: linear-gradient(135deg, #2a4a2a, #1a3a1a);
            transform: translateY(-2px);
            box-shadow: 0 0 25px rgba(80, 255, 80, 0.4);
            border-color: rgba(80, 255, 80, 0.8);
        }

        /* quiz header */
        .quiz-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 2rem;
            flex-wrap: wrap;
            border-bottom: 1px solid rgba(80, 255, 80, 0.3);
            padding-bottom: 1rem;
        }

        .progress-text {
            font-size: 0.85rem;
            font-weight: 500;
            color: #8bc34a;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .question-counter {
            font-weight: 600;
            color: #c0ffc0;
            background: rgba(30, 50, 30, 0.6);
            padding: 0.2rem 0.8rem;
            border-radius: 40px;
            font-size: 0.85rem;
            border: 1px solid rgba(80, 255, 80, 0.3);
        }

        .question-text {
            font-size: 1.6rem;
            font-weight: 500;
            line-height: 1.4;
            color: #e0ffe0;
            margin-bottom: 2rem;
            letter-spacing: -0.3px;
            text-shadow: 0 0 5px rgba(80, 255, 80, 0.3);
        }

        .answers-list {
            display: flex;
            flex-direction: column;
            gap: 0.9rem;
            margin-bottom: 2rem;
        }

        .answer-option {
            background: rgba(15, 25, 15, 0.7);
            backdrop-filter: blur(4px);
            border: 1.5px solid rgba(80, 255, 80, 0.25);
            border-radius: 20px;
            padding: 1rem 1.25rem;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 1rem;
            color: #ccffcc;
            font-weight: 450;
            line-height: 1.4;
            position: relative;
        }

        .answer-option:hover:not(.disabled-opt) {
            background: rgba(40, 70, 40, 0.8);
            border-color: rgba(80, 255, 80, 0.6);
            transform: translateX(4px);
        }

        /* временное выделение выбранного ответа (до подтверждения) */
        .answer-option.temp-selected {
            background: rgba(60, 100, 60, 0.8);
            border-color: #6fbf6f;
            box-shadow: 0 0 12px rgba(80, 255, 80, 0.3);
        }

        /* после подтверждения: правильный ответ (зеленый) */
        .answer-option.correct-final {
            background: rgba(30, 80, 30, 0.9);
            border-color: #4caf50;
            color: #a5ffa5;
            box-shadow: 0 0 15px rgba(76, 175, 80, 0.4);
            position: relative;
        }

        .answer-option.correct-final::after {
            content: "✓";
            position: absolute;
            right: 1.25rem;
            top: 50%;
            transform: translateY(-50%);
            font-weight: bold;
            font-size: 1.2rem;
            color: #7cff7c;
        }

        /* после подтверждения: неверный выбор пользователя (красный) */
        .answer-option.wrong-final {
            background: rgba(100, 40, 40, 0.9);
            border-color: #d32f2f;
            color: #ffb5b5;
            text-decoration: line-through;
            text-decoration-thickness: 1.5px;
            text-decoration-color: #ff6b6b;
            position: relative;
        }

        .answer-option.wrong-final::after {
            content: "✗";
            position: absolute;
            right: 1.25rem;
            top: 50%;
            transform: translateY(-50%);
            font-weight: bold;
            font-size: 1.2rem;
            color: #ff8888;
        }

        .answers-list.disabled .answer-option {
            cursor: default;
            pointer-events: none;
        }

        .nav-buttons {
            display: flex;
            justify-content: space-between;
            gap: 1rem;
            margin-top: 0.5rem;
        }

        .btn-nav {
            background: rgba(20, 30, 20, 0.7);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(80, 255, 80, 0.4);
            padding: 0.75rem 1.5rem;
            border-radius: 40px;
            font-weight: 500;
            cursor: pointer;
            transition: 0.2s;
            font-family: inherit;
            font-size: 0.9rem;
            color: #b8ffb8;
        }

        .btn-nav.primary {
            background: linear-gradient(135deg, #1a3a1a, #0a2a0a);
            border: 1px solid rgba(80, 255, 80, 0.6);
            color: white;
        }

        .btn-nav.primary:hover:not(:disabled) {
            background: linear-gradient(135deg, #2a4a2a, #1a3a1a);
            box-shadow: 0 0 12px rgba(80, 255, 80, 0.3);
        }

        .btn-nav.primary:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .btn-nav:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .feedback-message {
            font-size: 0.85rem;
            margin-top: 0.75rem;
            padding: 0.6rem 1rem;
            border-radius: 14px;
            display: inline-block;
            width: 100%;
            text-align: center;
            font-weight: 500;
            backdrop-filter: blur(4px);
        }

        .feedback-correct {
            background: rgba(30, 80, 30, 0.8);
            color: #a5ffa5;
            border: 1px solid rgba(76, 175, 80, 0.5);
        }

        .feedback-wrong {
            background: rgba(100, 40, 40, 0.8);
            color: #ffb5b5;
            border: 1px solid rgba(211, 47, 47, 0.5);
        }

        /* result screen */
        .result-card {
            text-align: center;
        }

        .score-circle {
            font-size: 5rem;
            font-weight: 700;
            color: #c0ffc0;
            margin: 1rem 0;
            text-shadow: 0 0 15px rgba(80, 255, 80, 0.5);
        }

        .result-stats {
            background: rgba(20, 30, 20, 0.6);
            backdrop-filter: blur(8px);
            border-radius: 28px;
            padding: 1.5rem;
            margin: 2rem 0;
            text-align: left;
            border: 1px solid rgba(80, 255, 80, 0.3);
            color: #ccffcc;
        }

        .restart-btn {
            background: linear-gradient(135deg, #1a3a1a, #0a2a0a);
            border: 1px solid rgba(80, 255, 80, 0.6);
            color: #c0ffc0;
            padding: 0.9rem 1.8rem;
            border-radius: 60px;
            font-weight: 500;
            cursor: pointer;
            width: 100%;
            font-size: 1rem;
            transition: all 0.2s;
        }

        .restart-btn:hover {
            background: linear-gradient(135deg, #2a4a2a, #1a3a1a);
            transform: translateY(-2px);
            box-shadow: 0 0 20px rgba(80, 255, 80, 0.3);
        }

        hr {
            margin: 1rem 0;
            border: 0;
            height: 1px;
            background: rgba(80, 255, 80, 0.3);
        }

        @media (max-width: 640px) {
            .app-container {
                padding: 1rem;
            }
            .card-inner {
                padding: 1.5rem;
            }
            .question-text {
                font-size: 1.3rem;
            }
            .time-display {
                font-size: 2.5rem;
            }
        }
    </style>
</head>
<body>

    <!-- Matrix Rain Canvas -->
    <canvas id="matrix-canvas"></canvas>

    <div class="app-container" id="appRoot"></div>

    <script>
        // --------------------------------------------------------------
        // MATRIX RAIN ANIMATION
        // --------------------------------------------------------------
        const canvas = document.getElementById('matrix-canvas');
        let ctx = canvas.getContext('2d');
        
        const chars = "01アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワヲンABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
        const charArray = chars.split('');
        let drops = [];
        let fontSize = 16;
        
        function initMatrix() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            fontSize = 16;
            const columns = Math.floor(canvas.width / fontSize);
            drops = [];
            for (let i = 0; i < columns; i++) {
                drops[i] = Math.random() * -100;
            }
        }
        
        function drawMatrix() {
            ctx.fillStyle = 'rgba(10, 15, 10, 0.045)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.font = fontSize + 'px "Courier New", monospace';
            
            for (let i = 0; i < drops.length; i++) {
                const char = charArray[Math.floor(Math.random() * charArray.length)];
                const x = i * fontSize;
                const y = drops[i] * fontSize;
                const brightness = Math.min(1, (drops[i] + 50) / 150);
                ctx.fillStyle = `rgba(180, 255, 180, ${0.7 + brightness * 0.3})`;
                ctx.fillText(char, x, y);
                drops[i]++;
                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                    drops[i] = 0;
                }
            }
            requestAnimationFrame(drawMatrix);
        }
        
        window.addEventListener('resize', () => {
            initMatrix();
        });
        
        initMatrix();
        drawMatrix();
        
        // --------------------------------------------------------------
        // Классы Answer и Question
        // --------------------------------------------------------------
        class Answer {
            constructor(text, isCorrect) {
                this.text = text;
                this.isCorrect = isCorrect === 1;
            }
        }

        class Question {
            constructor(text, answersArray) {
                this.text = text;
                this.answers = answersArray;
            }
        }

        // --------------------------------------------------------------
        // ПОЛНЫЙ МАССИВ ВОПРОСОВ (из предоставленных данных)
        // --------------------------------------------------------------
        const questionsData = [
            new Question("В соответствии с ФЗ «О государственной охране» безопасность объекта государственной охраны – это  ",
                [new Answer("Состояние защищенности лица, от противоправных посягательств, угрожающих его жизни, здоровью и иным охраняемым органам государственной охраны жизненно важным интересам, связанным с исполнением полномочий государственной власти либо с иной государственной, политической или общественной деятельностью", 0),
                new Answer("Состояние защищенности лица, подлежащего государственной охране, от противоправных и иных посягательств, угрожающих его жизни, здоровью и иным охраняемым законом жизненно важным интересам, связанным с исполнением полномочий государственной власти либо с иной государственной, политической или общественной деятельностью", 1),
                new Answer("Состояние защищенности лица, подлежащего государственной охране, от противоправных и иных посягательств, угрожающих его жизни, здоровью и иным охраняемым органами государственной жизненно важным интересам, связанным с исполнением полномочий государственной власти. ", 0)]),
            new Question("В соответствии с ФЗ «О государственной охране» в целях обеспечения безопасности государства по решению Президента РФ государственная охрана может быть предоставлена: ",
                [new Answer("Членам семьи Президента Российской Федерации, проживающим совместно с ним или сопровождающим его", 0),
                new Answer("Членам Совета Федерации Федерального Собрания Российской Федерации, депутатам Государственной Думы Федерального Собрания Российской Федерации, федеральным государственным служащим и иным лицам", 1),
                new Answer("Главам иностранных государств и правительств, членам их семей в период пребывания на территории Российской Федерации.", 0)]),
            new Question("В соответствии с ФЗ «О государственной охране» сотрудники ФСО имеют право применять оружие в случае: ",
                [new Answer("Необходимости остановить транспортное средство путем его повреждения, если водитель создает реальную угрозу безопасности объектов государственной охраны", 0),
                new Answer("Задержания правонарушителей и лиц, в отношении которых имеются достаточные основания полагать, что они намерены оказать вооруженное сопротивление", 0),
                new Answer("Задержания лица, оказывающего вооруженное сопротивление или отказывающегося выполнять законное требование о сдаче оружия, если другими способами и средствами подавить сопротивление, задержать лицо или изъять оружие невозможно.", 1)]),
            new Question("Степени секретности сведений, составляющих государственную тайну: ",
                [new Answer("Особой важности, совершенно секретно, секретно", 1),
                new Answer("Первая, вторая, третья", 0),
                new Answer("Совершенно секретно, секретно, конфиденциально.", 0)]),
            new Question("В соответствии с ФЗ «О государственной охране» государственная охрана осуществляется на основе: ",
                [new Answer("Конституции РФ, ФЗ «О государственной охране», других ФЗ и иных нормативных правовых актов РФ, международных договоров РФ, а также инструкций, утвержденных руководителем ФСО", 0),
                new Answer("Конституции РФ, федеральных конституционных законов, ФЗ «О государственной охране», других ФЗ и иных нормативных правовых актов РФ, а также международных договоров РФ", 1),
                new Answer("Конституции РФ, федеральных конституционных законов, ФЗ «О государственной охране», других законов и иных нормативных правовых актов РФ, а также приказов и распоряжений руководства ФСО России", 0)]),
            new Question("В соответствии с ФЗ «О государственной охране» охранное мероприятие это –  ",
                [new Answer("Совокупность действий, направленных на обеспечение безопасности объекта государственной охраны и осуществляемых органами государственной охраны самостоятельно или с привлечением сил и средств других государственных органов обеспечения безопасности", 1),
                new Answer("Совокупность действий по предоставлению объектам государственной охраны персональной охраны, специальной связи и транспортного обеспечения, осуществляемых федеральными органами государственной охраны, в том числе с привлечением других государственных органов обеспечения безопасности", 0),
                new Answer("Совокупность действий по обеспечению безопасности объектов государственной охраны, поддержанию порядка, установленного уполномоченными на то должностными лицами и пропускного режима на охраняемых объектах, осуществляемых федеральными органами государственной охраны, в том числе с привлечением других государственных органов обеспечения безопасности.  ", 0)]),
            new Question("Какая из перечисленных обязанностей не возлагается на федеральные органы государственной охраны: ",
                [new Answer("Организовывать и выполнять шифровальные работы", 0),
                new Answer("Контролировать соблюдение гражданами установленных правил паспортной системы, а также соблюдение иностранными гражданами и лицами без гражданства установленных для них правил пребывания на территории Российской Федерации", 1),
                new Answer("Обеспечивать и (или) осуществлять профессиональное обучение, профессиональное образование и дополнительное профессиональное образование", 0)]),
            new Question("В соответствии с ФЗ «Об оружии» гражданское оружие должно: ",
                [new Answer("Иметь емкость магазина не более 8 патронов ", 0),
                new Answer("Исключить ведение огня очередями и иметь емкость магазина не более 8 патронов", 0),
                new Answer("Исключить ведение огня очередями и иметь емкость магазина не более 10 патронов", 1)]),
            new Question(" В соответствии с УК РФ уголовную ответственность несут только:",
                [new Answer("Физические и юридические лица", 0),
                new Answer("Дееспособные граждане Российской Федерации", 0),
                new Answer("Вменяемые физические лица, достигшие установленного уголовным законом возраста", 1)]),
            new Question("Форма допуска к государственной тайне: ",
                [new Answer("Особой важности, совершенно секретно, секретно", 0),
                new Answer("Первая, вторая, третья", 1),
                new Answer("Совершенно секретно, секретно, конфиденциально.", 0)]),
            new Question(" Мобилизация в Российской Федерации может быть:",
                [new Answer("Внезапной или плановой", 0),
                new Answer("Общей или частичной", 1),
                new Answer("Заблаговременной или упреждающей", 0)]),
            new Question("Кто устанавливает уровень террористической опасности, содержание мер по обеспечению безопасности личности, общества и государства: ",
                [new Answer("ФСБ России", 0),
                new Answer("Президент Российской Федерации", 0),
                new Answer("Национальный антитеррористический комитет", 1)]),
            new Question("«Террористический» акт это: ",
                [new Answer("Совершение взрыва, поджога или иных действий, устрашающих население и создающих опасность гибели человека, причинения значительного имущественного ущерба либо наступления иных тяжких последствий, в целях дестабилизации деятельности органов власти или международных организаций либо воздействия на принятие мим решений, а также угроза совершения указанных действий в тех же целях", 1),
                new Answer("Экстремистские действия, направленные на подрыв основ государственности, дестабилизацию ситуации в стране и разжигании религиозной ненависти", 0),
                new Answer("Совершение взрыва, поджога или иных действий, устрашающих население и создающих опасность гибели человека, причинения значительного имущественного ущерба либо наступления иных тяжких последствий, в целях дестабилизации общества или воздействия на принятие гражданами решений, а также угроза совершения указанных действий в тех же целях.", 0)]),
            new Question("В соответствии с ФЗ «Об оружии» пули к огнестрельному гладкоствольному и нарезному короткоствольному оружию: ",
                [new Answer("Не могут иметь сердечников из твердых материалов", 1),
                new Answer("Могут иметь сердечники из твердых материалов", 0),

            new Question(" В соответствии с УК РФ (ст.205) террористический акт это:",
                [new Answer("Совершение взрыва, поджога или иных действий, устрашающих население и создающих опасность гибели человека, в целях дестабилизации деятельности органов власти.", 1),
                new Answer("Совершение действий в отношении большой массы людей, с целью навязывания идей и ценностей иной социальной или религиозной организации.", 0),
                new Answer("Совершение запрещенных насильственных или ненасильственных методов навязывания политики и идей незаконной организацией.", 0)]),
            new Question("Публичное мероприятие может проходить в виде: ",
                [new Answer("Собрания, митинга, шествия.", 0),
                new Answer("Демонстрации и пикетирования.", 0),
                new Answer("Во всех перечисленных случаях.", 1)]),
            new Question("Не требуется уведомления о проведении публичного мероприятия для: ",
                [new Answer("Действующих партий РФ входящих в Государственную Думу.", 0),
                new Answer("Для пикетирования, проводимого одним участником без использования быстровозводимой сборно-разборной конструкций.", 1),
                new Answer("Групп граждан, выступающих в поддержку законных органов власти.", 0)])
        ];

        // Функция перемешивания
        function shuffleArray(arr) {
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        class ShuffledQuestion {
            constructor(originalQuestion, shuffledAnswers, correctShuffledIndex) {
                this.text = originalQuestion.text;
                this.shuffledAnswers = shuffledAnswers;
                this.correctShuffledIndex = correctShuffledIndex;
            }
        }

        let shuffledQuestions = [];
        let userSelections = [];
        let answerConfirmed = [];
        let currentIndex = 0;
        let currentView = 'start';
        let timeInterval = null;

        function initShuffledData() {
            let questionsCopy = [...questionsData];
            questionsCopy = shuffleArray(questionsCopy);
            
            shuffledQuestions = questionsCopy.map(origQ => {
                const answersWithFlags = origQ.answers.map(ans => ({
                    text: ans.text,
                    isCorrect: ans.isCorrect
                }));
                const shuffledAns = shuffleArray([...answersWithFlags]);
                const correctShuffledIndex = shuffledAns.findIndex(a => a.isCorrect === true);
                return new ShuffledQuestion(origQ, shuffledAns, correctShuffledIndex);
            });
            
            userSelections = new Array(shuffledQuestions.length).fill(null);
            answerConfirmed = new Array(shuffledQuestions.length).fill(false);
            currentIndex = 0;
        }

        function formatDate() {
            return new Date().toLocaleDateString('ru-RU', { year: 'numeric', month: 'long', day: 'numeric' });
        }
        function formatTime() {
            return new Date().toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
        }

        function startLiveTime() {
            if (timeInterval) clearInterval(timeInterval);
            timeInterval = setInterval(() => {
                const timeElem = document.getElementById('liveTime');
                if (timeElem && currentView === 'start') {
                    timeElem.innerText = formatTime();
                }
            }, 1000);
        }

        function renderStart() {
            return `
                <div class="card">
                    <div class="card-inner">
                        <div class="datetime-section">
                            <div class="date-display">${formatDate()}</div>
                            <div class="time-display" id="liveTime">${formatTime()}</div>
                            <div class="calendar-mini">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
                                <span>${formatDate()}</span>
                            </div>
                        </div>
                        <button class="btn-start" id="startTestBtn">Начать тестирование</button>
                    </div>
                </div>
            `;
        }

        function renderQuiz() {
            const q = shuffledQuestions[currentIndex];
            const selectedIdx = userSelections[currentIndex];
            const confirmed = answerConfirmed[currentIndex];
            const isLast = currentIndex === shuffledQuestions.length - 1;
            
            let answersHtml = '';
            q.shuffledAnswers.forEach((ans, idx) => {
                let additionalClass = '';
                if (!confirmed) {
                    if (selectedIdx === idx) additionalClass = 'temp-selected';
                } else {
                    if (idx === q.correctShuffledIndex) {
                        additionalClass = 'correct-final';
                    } else if (idx === selectedIdx && selectedIdx !== q.correctShuffledIndex) {
                        additionalClass = 'wrong-final';
                    }
                }
                answersHtml += `<div class="answer-option ${additionalClass}" data-ans-idx="${idx}">${ans.text}</div>`;
            });
            
            const feedbackHtml = confirmed ? 
                (selectedIdx === q.correctShuffledIndex ? 
                    '<div class="feedback-message feedback-correct">✓ Правильный ответ!</div>' : 
                    '<div class="feedback-message feedback-wrong">✗ Неправильный ответ. Правильный ответ выделен зеленым.</div>')
                : '<div class="feedback-message" style="background:rgba(30,40,30,0.7); color:#8bc34a;">● Выберите вариант и нажмите «Подтвердить»</div>';
            
            return `
                <div class="card">
                    <div class="card-inner">
                        <div class="quiz-header">
                            <span class="progress-text">АТТЕСТАЦИЯ СОТРУДНИКОВ</span>
                            <span class="question-counter">${currentIndex+1} / ${shuffledQuestions.length}</span>
                        </div>
                        <div class="question-text">${q.text}</div>
                        <div class="answers-list ${confirmed ? 'disabled' : ''}" id="answersContainer">
                            ${answersHtml}
                        </div>
                        ${feedbackHtml}
                        <div class="nav-buttons">
                            <button class="btn-nav" id="prevBtn" ${currentIndex === 0 ? 'disabled' : ''}>← Назад</button>
                            ${!confirmed ? 
                                `<button class="btn-nav primary" id="confirmBtn" ${selectedIdx === null ? 'disabled' : ''}>Подтвердить ответ</button>` :
                                `<button class="btn-nav primary" id="nextBtn">${isLast ? 'Завершить тест' : 'Следующий вопрос →'}</button>`
                            }
                        </div>
                    </div>
                </div>
            `;
        }

        function computeResult() {
            let correct = 0;
            for (let i = 0; i < shuffledQuestions.length; i++) {
                const selected = userSelections[i];
                if (selected !== null && selected === shuffledQuestions[i].correctShuffledIndex) {
                    correct++;
                }
            }
            return { correct, total: shuffledQuestions.length, percent: Math.round((correct / shuffledQuestions.length) * 100) };
        }

        function renderResult() {
            const { correct, total, percent } = computeResult();
            return `
                <div class="card result-card">
                    <div class="card-inner">
                        <div style="text-align:center">
                            <h2 style="font-weight:500; margin-bottom:0.5rem; color:#c0ffc0;">Результаты тестирования</h2>
                            <div class="score-circle">${correct} / ${total}</div>
                            <div style="font-size:1.2rem; font-weight:500; color:#a5ffa5;">${percent}% правильных ответов</div>
                            <hr>
                            <div class="result-stats">
                                ${correct >= (total * 0.7) ? '✅ Успешное прохождение. Уровень знаний достаточен.' : '⚠️ Рекомендуется повторное изучение материалов.'}
                            </div>
                            <button class="restart-btn" id="restartBtn">⟳ Пройти заново</button>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderApp() {
            const root = document.getElementById('appRoot');
            if (currentView === 'start') {
                root.innerHTML = renderStart();
                startLiveTime();
                document.getElementById('startTestBtn')?.addEventListener('click', () => {
                    if (timeInterval) clearInterval(timeInterval);
                    initShuffledData();
                    currentView = 'quiz';
                    renderApp();
                });
            } 
            else if (currentView === 'quiz') {
                root.innerHTML = renderQuiz();
                const container = document.getElementById('answersContainer');
                const confirmed = answerConfirmed[currentIndex];
                
                if (!confirmed && container) {
                    const options = container.querySelectorAll('.answer-option');
                    options.forEach(opt => {
                        opt.addEventListener('click', () => {
                            if (answerConfirmed[currentIndex]) return;
                            const idx = parseInt(opt.dataset.ansIdx);
                            userSelections[currentIndex] = idx;
                            renderApp();
                        });
                    });
                }
                
                document.getElementById('prevBtn')?.addEventListener('click', () => {
                    if (currentIndex > 0) {
                        currentIndex--;
                        renderApp();
                    }
                });
                
                const confirmBtn = document.getElementById('confirmBtn');
                if (confirmBtn && !answerConfirmed[currentIndex]) {
                    confirmBtn.addEventListener('click', () => {
                        if (userSelections[currentIndex] !== null) {
                            answerConfirmed[currentIndex] = true;
                            renderApp();
                        }
                    });
                }
                
                const nextBtn = document.getElementById('nextBtn');
                if (nextBtn && answerConfirmed[currentIndex]) {
                    nextBtn.addEventListener('click', () => {
                        const isLast = currentIndex === shuffledQuestions.length - 1;
                        if (isLast) {
                            currentView = 'result';
                            if (timeInterval) clearInterval(timeInterval);
                            renderApp();
                        } else {
                            currentIndex++;
                            renderApp();
                        }
                    });
                }
            } 
            else if (currentView === 'result') {
                if (timeInterval) clearInterval(timeInterval);
                root.innerHTML = renderResult();
                document.getElementById('restartBtn')?.addEventListener('click', () => {
                    initShuffledData();
                    currentView = 'start';
                    renderApp();
                });
            }
        }

        initShuffledData();
        renderApp();
    </script>
</body>
</html>
